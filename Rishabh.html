<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rishabh Sharma — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f; --glass:rgba(16,22,42,.55); --line:rgba(150,170,255,.16); --text:#eef1fb; --muted:#97a2c4; --sun:#ffb347; --sky:#7aa8ff;
  box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#05070f; }  /* space stays dark in both themes */
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 700px at 75% 0%,#0d1430 0%,var(--bg) 60%) fixed;color:var(--text);font-family:"Lato",system-ui,sans-serif;line-height:1.55}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
a{color:var(--sky)} a:focus-visible,.row:focus-visible,.pill:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

.hero{position:relative;height:100svh;min-height:560px;display:flex;align-items:flex-end;padding:0 clamp(20px,5vw,64px) clamp(60px,10vh,96px);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hero.drag{cursor:grabbing}
.hero h1{margin:0;font-size:clamp(3.4rem,13vw,10rem);font-weight:800;letter-spacing:-.015em;line-height:.88;background:linear-gradient(180deg,#fff 30%,#8fa4e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:18px 0 0;max-width:30ch;color:var(--muted);font-size:clamp(1rem,2.2vw,1.3rem)}
.hint{position:absolute;right:clamp(20px,5vw,64px);bottom:28px;color:#8793b8;font-size:.9rem;text-align:right;pointer-events:none}
.scroll{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);color:#8793b8;text-decoration:none;font-size:.85rem}

.content{max-width:1120px;margin:0 auto;padding:40px 16px 80px;display:grid;gap:16px;grid-template-columns:1fr 1.25fr;grid-template-areas:"about stack" "projects projects" "learn social"}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
h2{margin:0 0 14px;font-size:1.05rem;font-weight:600;color:var(--muted)}
p{margin:0 0 12px}

.about{grid-area:about}
.about h3{font-size:1.6rem;margin:0 0 14px;font-weight:600;line-height:1.2}
.facts{margin:20px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.facts span:first-child{color:var(--muted)}

.stack{grid-area:stack}
.row{padding:9px 12px;margin:0 -12px;border-radius:12px;transition:background .2s}
.row.on{background:rgba(255,179,71,.1)}
.bar-head{display:flex;justify-content:space-between;font-size:.97rem;margin-bottom:6px}
.bar-head span:last-child{color:var(--muted)}
.track{height:8px;background:rgba(150,170,255,.14);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}

.projects{grid-area:projects}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.proj{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.02);transition:border-color .2s,transform .2s}
.proj:hover{border-color:var(--sun);transform:translateY(-4px)}
.proj h3{margin:0;font-size:1.2rem}
.proj p{color:var(--muted);margin:0;font-size:.97rem;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.proj a{font-weight:600;text-decoration:none}

.learn{grid-area:learn}
.learn ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.learn li{display:flex;gap:10px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.social{grid-area:social;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.social h2{width:100%}
.pill{padding:9px 18px;border:1px solid var(--line);border-radius:99px;color:var(--text);text-decoration:none;font-size:.97rem;transition:border-color .2s,color .2s}
.pill:hover{border-color:var(--sky);color:var(--sky)}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.proj,.fill{transition:none}html{scroll-behavior:auto}}
@media (max-width:820px){
  .content{grid-template-columns:1fr;grid-template-areas:"about" "stack" "projects" "learn" "social"}
  .hint{left:20px;right:auto;text-align:left;bottom:62px}
  .hero{padding-bottom:110px}
}
.nav{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:22px;padding:9px 12px 9px 20px;border:1px solid var(--line);border-radius:99px;background:rgba(10,14,30,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);white-space:nowrap}
.nav #logo{color:var(--text);font-weight:800;text-decoration:none;letter-spacing:-.015em}
.nav span{display:flex;gap:4px}.nav span a{color:var(--muted);text-decoration:none;font-size:.9rem;padding:5px 12px;border-radius:99px;transition:background .2s,color .2s}
.nav span a:hover{background:rgba(150,170,255,.14);color:var(--text)}
.hero>div:first-child{animation:rise 1.5s .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
@media (prefers-reduced-motion:reduce){.hero>div:first-child{animation:none}}
.hero h1{text-shadow:none;filter:drop-shadow(0 6px 40px rgba(110,130,255,.35))}

/* no boxes: content sits directly on space */
.card{background:none;border:0;border-radius:0;padding:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;text-shadow:0 1px 16px rgba(3,5,15,.7)}
.content{max-width:1040px;padding:70px 24px 60px;gap:100px 80px}
h2{font-size:clamp(1.7rem,3.4vw,2.3rem);font-weight:800;letter-spacing:-.015em;color:var(--text);margin-bottom:24px}
.pgrid{display:block}
.proj{display:grid;grid-template-columns:1.1fr 2fr auto auto;gap:8px 28px;align-items:center;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:26px 0;transform:none}
.proj:last-child{border-bottom:1px solid var(--line)}
.proj:hover{transform:none;border-color:var(--sun)}
.proj:hover h3{color:var(--sun)}
.proj h3{transition:color .2s}
.row{margin:0 -10px;padding:9px 10px}
.social h2,.learn h2{margin-bottom:18px}
#intro{position:fixed;inset:0;z-index:50;background:#02030a;transition:opacity 1.2s ease}
#intro.out{opacity:0;pointer-events:none}
#warp{width:100%;height:100%;display:block}
.itext{position:absolute;top:14%;left:0;right:0;text-align:center;color:#b9c6ee;letter-spacing:.14em;font-size:clamp(.95rem,2.4vw,1.2rem);opacity:0;pointer-events:none}
#skip,#replay{font:inherit;color:var(--muted);background:none;border:1px solid var(--line);border-radius:99px;padding:7px 16px;cursor:pointer}
#skip{position:absolute;right:20px;bottom:max(20px,env(safe-area-inset-bottom,0px))}
#skip:hover,#replay:hover{color:var(--text);border-color:var(--sky)}
.foot{text-align:center;padding:0 0 60px}
.nav,.hint,.scroll{opacity:0;transition:opacity 1.2s}
.hint,.scroll{transition-delay:1.6s}
body.go .nav,body.go .hint,body.go .scroll{opacity:1}
.hero>div:first-child{animation:none;opacity:0}
body.go .hero>div:first-child{opacity:1;animation:rise 1.6s .5s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:820px){.proj{grid-template-columns:1fr}.content{gap:72px}}
@media (prefers-reduced-motion:reduce){body.go .hero>div:first-child{animation:none}}

/* ---- the page is a journey: big type, planets for projects, gauges for skills ---- */
.content{display:block;max-width:1100px;padding:0 24px;margin:0 auto;text-shadow:0 1px 18px rgba(3,5,15,.75)}
.sec{padding:clamp(80px,14vh,150px) 0}
.statement{font-size:clamp(2rem,5.4vw,4.6rem);font-weight:600;letter-spacing:-.015em;line-height:1.05;max-width:20ch;margin:0 0 56px}
.about-cols{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:start}
#bio p{font-size:1.15rem;color:var(--muted);max-width:46ch}
.sub{color:var(--muted);margin:-8px 0 48px;font-size:1.1rem}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:48px 24px}
.ring{display:grid;justify-items:center;gap:12px}
.rwrap{position:relative;width:132px;height:132px;transition:transform .3s}
.ring:hover .rwrap{transform:scale(1.06)}
.arc{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.num{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;font-weight:800;letter-spacing:-.015em}
.ring>span{color:var(--muted)}
.world{display:flex;align-items:center;gap:clamp(32px,7vw,100px);margin:0 0 clamp(70px,12vh,130px)}
.world:nth-child(even){flex-direction:row-reverse}
.wtxt h3{margin:0 0 14px;font-size:clamp(2rem,4.5vw,3.6rem);letter-spacing:-.015em;line-height:1}
.wtxt p{color:var(--muted);font-size:1.12rem;max-width:36ch;margin:0 0 18px}
.wtxt .tags{margin-bottom:20px}
.wlink{font-weight:600;color:var(--sky);text-decoration:none}
.wlink:hover{text-decoration:underline}
.orb{--s:clamp(170px,26vw,300px);width:var(--s);height:var(--s);flex:none;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 32% 30%,var(--a),var(--b) 60%,#02030a 100%);
  box-shadow:0 0 90px -12px var(--b),inset -30px -24px 56px rgba(0,0,10,.8),inset 6px 4px 22px rgba(255,255,255,.18);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.orb i{position:absolute;inset:0;mix-blend-mode:soft-light;background-repeat:repeat-x;background-size:100% 100%;
  background-image:radial-gradient(circle at 18% 38%,rgba(255,255,255,.55) 0 11%,transparent 12%),radial-gradient(circle at 62% 66%,rgba(0,0,0,.5) 0 15%,transparent 16%),radial-gradient(circle at 85% 28%,rgba(255,255,255,.4) 0 8%,transparent 9%),radial-gradient(circle at 40% 85%,rgba(0,0,0,.4) 0 9%,transparent 10%);
  animation:spinorb 36s linear infinite}
@keyframes spinorb{to{background-position-x:100%}}
.world:hover .orb{transform:scale(1.07)}
#learning-list{list-style:none;margin:0;padding:0;display:grid;gap:20px}
#learning-list li{display:flex;gap:16px;align-items:center;font-size:clamp(1.3rem,3vw,2.2rem);font-weight:600;letter-spacing:-.015em}
.contact{padding-bottom:120px}
.contact h2{font-size:clamp(2.4rem,7vw,6rem);line-height:1;max-width:14ch;margin-bottom:44px}
.bigs{display:flex;flex-wrap:wrap;gap:14px 38px}
.bigs a{font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:600;color:var(--text);text-decoration:none;border-bottom:2px solid var(--line);padding-bottom:4px;transition:border-color .2s,color .2s}
.bigs a:hover{color:var(--sun);border-color:var(--sun)}
#tele{position:fixed;left:20px;bottom:18px;z-index:4;color:#7f8bb0;font-size:.82rem;font-variant-numeric:tabular-nums;opacity:0;transition:opacity 1.2s 1.6s;pointer-events:none}
body.go #tele{opacity:1}
@media (max-width:820px){.about-cols{grid-template-columns:1fr}.world,.world:nth-child(even){flex-direction:column;align-items:flex-start}#tele{display:none}}
@media (prefers-reduced-motion:reduce){.orb i{animation:none}.arc{transition:none}}

/* ---- professional pass: one typeface, restrained colour, editorial layout ---- */
:root{--sun:#dbe4ff;--sky:#9db9ff;--line:rgba(160,175,215,.16);--muted:#8d97ad}
.hero h1{background:none;-webkit-text-fill-color:currentColor;color:var(--text);filter:none;font-weight:500;letter-spacing:-.015em;font-size:clamp(2.8rem,9vw,8rem)}
.hero p{font-weight:400}
.nav{background:rgba(8,11,22,.5)}
.nav #logo{font-weight:600}
.content{max-width:1120px}
.sec{display:grid;grid-template-columns:210px minmax(0,1fr);gap:48px;padding:56px 0 clamp(80px,13vh,130px);border-top:1px solid var(--line)}
.sec>h2{position:sticky;top:92px;align-self:start;margin:0;font-size:1rem;font-weight:500;color:var(--muted);letter-spacing:0}
.statement{font-size:clamp(1.8rem,4vw,3.2rem);font-weight:500;letter-spacing:-.015em;line-height:1.12;max-width:24ch;margin:0 0 44px}
.about-cols{display:grid;grid-template-columns:1.2fr 1fr;gap:48px}
#bio p{font-size:1.1rem;font-weight:400;color:#b4bcd0}
.sub{margin:0 0 36px;color:var(--muted);font-size:1.05rem}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:30px 64px}
.skill{outline-offset:8px}
.sk-top{display:flex;justify-content:space-between;margin-bottom:12px;font-size:1.05rem}
.sk-pct{color:var(--muted);font-variant-numeric:tabular-nums}
.sk-line{height:2px;background:var(--line);position:relative}
.sk-line i{position:absolute;left:0;top:0;height:100%;width:0;background:var(--text);transition:width 1.5s cubic-bezier(.2,.8,.2,1)}
.skill:hover .sk-line i{background:var(--sky)}
#plist{display:block}
.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px 40px;padding:32px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:none;transform:none}
.proj:first-child{border-top:0;padding-top:0}
.proj:last-child{border-bottom:0}
.proj:hover{border-color:var(--line);transform:none}
.proj h3{margin:0;font-size:clamp(1.5rem,2.8vw,2.2rem);font-weight:500;letter-spacing:-.015em;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.proj:hover h3{transform:translateX(10px);color:var(--text)}
.proj p{margin:0 0 14px;color:#b4bcd0;font-weight:400;font-size:1.05rem;max-width:52ch}
.tags{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:16px}
.tags span{border:0;border-radius:0;padding:0;font-size:.9rem;color:var(--muted)}
.wlink{color:var(--text);font-size:.95rem;font-weight:500;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.wlink:hover{border-color:var(--sky);color:var(--sky);text-decoration:none}
#learning-list li{font-size:1.25rem;font-weight:400;letter-spacing:-.015em}
.dot{animation:none;width:6px;height:6px;background:var(--muted)}
.cline{font-size:clamp(1.8rem,4.2vw,3.3rem);font-weight:500;letter-spacing:-.015em;line-height:1.1;max-width:20ch;margin:0 0 36px}
.bigs a{font-size:1.15rem;font-weight:500}
.bigs{gap:12px 32px}
.contact{padding-bottom:100px}
@media (max-width:820px){.sec{grid-template-columns:1fr;gap:20px}.sec>h2{position:static}.about-cols,.skills,.proj{grid-template-columns:1fr}.skills{gap:26px}}

/* ---- typography fix: normal letter-spacing, readable weights, better wrapping ---- */
html{scroll-padding-top:90px}
.hero h1{font-weight:600;letter-spacing:-.02em;line-height:1.02;text-wrap:balance}
.hero p{max-width:40ch;line-height:1.5}
.statement,.proj h3,.cline{font-weight:600;line-height:1.15;text-wrap:balance}
.statement{letter-spacing:-.02em}
.cline{max-width:22ch}
.proj{align-items:start}
.proj h3{line-height:1.12}
.sec>h2{font-weight:600}
.nav #logo{letter-spacing:0}

/* ---- quieter name ---- */
.hero h1{font-size:clamp(2.2rem,5.2vw,4.6rem);font-weight:600}
.hero p{font-size:clamp(1rem,1.6vw,1.2rem)}
.nav #logo{opacity:0;transition:opacity .4s}
.nav #logo.vis{opacity:1}

/* ---- nav without empty space; scene switch; projects in progress ---- */
.nav{padding:9px 10px;gap:0;transition:gap .5s,padding .5s}
.nav.sn{padding:9px 10px 9px 20px;gap:22px}
.nav #logo{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .5s,opacity .4s}
.nav.sn #logo{max-width:240px;opacity:1}
.mode{position:absolute;right:clamp(20px,5vw,64px);bottom:28px;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:99px;background:rgba(8,11,22,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;transition:opacity 1.2s 1.6s}
body.go .mode{opacity:1}
.mode button{font:inherit;font-size:.9rem;color:var(--muted);background:none;border:0;border-radius:99px;padding:7px 16px;cursor:pointer;transition:background .25s,color .25s}
.mode button:hover{color:var(--text)}
.mode button[aria-pressed="true"]{background:rgba(160,185,255,.18);color:var(--text)}
.mode button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.still{display:flex;gap:14px;align-items:center;margin:0;color:var(--muted);font-size:1.15rem;max-width:46ch}
@media (max-width:820px){.mode{left:20px;right:auto;bottom:70px}}

/* ---- smaller headings, soft section transitions ---- */
.hero h1{font-size:clamp(2rem,4.4vw,3.8rem)}
.hero p{font-size:clamp(.95rem,1.4vw,1.1rem)}
.statement{font-size:clamp(1.5rem,3vw,2.3rem);max-width:30ch;margin-bottom:36px}
.cline{font-size:clamp(1.5rem,3.2vw,2.5rem);max-width:26ch}
#bio p{font-size:1.02rem}
#learning-list li{font-size:1.1rem}
.sec>h2{font-size:.95rem}
.sub{font-size:1rem}
.bigs a{font-size:1.05rem}
.skills{gap:26px 64px}
.sec{border-top:0;position:relative}
.sec::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent)}
.sec>*{opacity:0;transform:translateY(22px);transition:opacity 1.2s cubic-bezier(.2,.8,.2,1),transform 1.2s cubic-bezier(.2,.8,.2,1)}
.sec>div,.sec>ul{transition-delay:.14s}
.sec.in>*{opacity:1;transform:none}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:180px;background:linear-gradient(transparent,rgba(5,7,15,.5));pointer-events:none}
.hero>div:first-child,.mode,.scroll{z-index:1}
.hero>div:first-child{position:relative}
@media (prefers-reduced-motion:reduce){.sec>*{opacity:1;transform:none;transition:none}}

/* ---- space display font, plain skill list, mobile-safe controls ---- */
:root{--display:"Lato","Lato",system-ui,sans-serif}
h1,h2,h3,.statement,.cline,.nav #logo{font-family:var(--display)}
.hero h1{letter-spacing:-.01em;font-weight:500}
.statement,.cline{letter-spacing:-.01em;font-weight:500}
.sec>h2{font-weight:500}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px 40px}
.skill{display:flex;align-items:center;gap:12px;font-size:1.12rem;font-weight:500}
.skill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none}
@media (max-width:820px){
  .mode{top:calc(env(safe-area-inset-top,0px) + 76px);bottom:auto;left:50%;right:auto;transform:translateX(-50%)}
  .hero{padding-bottom:90px}
}
@media (max-width:560px){
  .nav{max-width:calc(100vw - 16px)}
  .nav span{gap:0}
  .nav span a{padding:5px 9px;font-size:.85rem}
  .nav.sn{padding:9px 10px;gap:0}
  .nav.sn #logo{max-width:0;opacity:0}
  .mode button{padding:6px 12px;font-size:.85rem}
  .sec{padding-top:44px}
  .skills{grid-template-columns:1fr 1fr;gap:14px 20px}
  .skill{font-size:1rem}
}

/* ---- inspired by the old blog: monogram, mono meta text, writing, live activity dots ---- */
.mono-f{font-family:"Lato",system-ui,sans-serif}
.brand{display:flex;align-items:center;text-decoration:none;color:var(--text)}
.mono{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:600;letter-spacing:.02em;font-family:var(--display);color:#fff;
  background:radial-gradient(circle at 32% 28%,#7f9bff,#2b3f9e 60%,#0b1130);box-shadow:inset -4px -3px 8px rgba(0,0,10,.55)}
.nav,.nav.sn{padding:7px 10px 7px 8px;gap:8px}
.nav #logo{margin-left:0}
.nav.sn #logo{margin-left:10px}
.hero .role,.wmeta,.tags span,#tele{font-family:"Lato",system-ui,sans-serif}
.hero .role{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.hero #tagline{font-style:italic}
.wmeta{margin:0 0 12px;font-size:.85rem;color:var(--muted)}
.tags span{font-size:.82rem}
.dot{background:#3ddc97;animation:pulse 2.4s infinite;box-shadow:0 0 8px rgba(61,220,151,.6)}

    if(d < 90){ const f = (90 - d) / 90 * 14; x += dx / d * f; y += dy / d * f; }
    ctx.globalAlpha = .3 + .55 * Math.abs(Math.sin(now / 1100 * (.5 + s.k) + s.t)); ctx.fillStyle = s.c;
    const L = Math.max(-70, Math.min(70, sv * s.k * 1.1)); if(Math.abs(L) > 1.5){ ctx.strokeStyle = s.c; ctx.lineWidth = s.s; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + L); ctx.stroke(); } else ctx.fillRect(x, y, s.s, s.s);
  });
  ctx.globalAlpha = 1;

  if(now > nextShoot && !still){ shooters.push({x: rnd(W * .3, W * 1.1), y: rnd(-20, H * .35), vx: -rnd(9, 15), vy: rnd(4, 7), l: 1}); nextShoot = now + rnd(3500, 8000); }
  shooters = shooters.filter(s => s.l > 0 && s.x > -80 && s.y < H + 80);
  shooters.forEach(s => { s.x += s.vx; s.y += s.vy; s.l -= .011;
    const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
    g.addColorStop(0, "rgba(255,255,255," + s.l + ")"); g.addColorStop(1, "rgba(160,190,255,0)");
    ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); ctx.stroke(); });

  if(px > 0 && hero.getBoundingClientRect().bottom > py){
    const g = ctx.createRadialGradient(px, py, 0, px, py, 170); g.addColorStop(0, "rgba(130,160,255,.12)"); g.addColorStop(1, "rgba(130,160,255,0)");
    ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(px - 170, py - 170, 340, 340); ctx.globalCompositeOperation = "source-over";
  }

  if(cy > -R * 1.2 && cy < H + R * 1.2){
    if(ease * (1 - bh) > .01) drawSolar(cx, cy, R, ease * (1 - bh), now, dt);
    const kill = bh > .5 ? R * .2 : 24, grav = 900 + 2000 * bh;
    comets = comets.filter(c => c.life > 0 && Math.hypot(c.x - cx, c.y - cy) > kill);
    comets.forEach(c => {
      const dx = cx - c.x, dy = cy - c.y, d = Math.max(Math.hypot(dx, dy), 30), a = grav / (d * d) * 60;
      c.vx += dx / d * a * .016; c.vy += dy / d * a * .016; c.x += c.vx; c.y += c.vy; c.life -= .0016;
      c.trail.push([c.x, c.y]); if(c.trail.length > 40) c.trail.shift(); ctx.lineCap = "round";
      for(let i = 1; i < c.trail.length; i++){ ctx.strokeStyle = "rgba(190,215,255," + (i / c.trail.length * .65 * Math.min(c.life * 3, 1)) + ")";
        ctx.lineWidth = i / c.trail.length * 3; ctx.beginPath(); ctx.moveTo(c.trail[i-1][0], c.trail[i-1][1]); ctx.lineTo(c.trail[i][0], c.trail[i][1]); ctx.stroke(); }
      ctx.fillStyle = "#fff"; ctx.shadowColor = "#9fc1ff"; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(c.x, c.y, 2.5, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
    });
  }
  sparks = sparks.filter(s => s.l > 0);
  sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.vx *= .96; s.vy *= .96; s.l -= .03; ctx.globalAlpha = Math.max(s.l, 0); ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, 2, 2); });
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
function pick(x, y){
  if(bh > .5) return -1;
  let best = -1, bd = 1e9;
  planets.forEach((p, i) => { const d = Math.hypot(p.x - x, p.y - y); if(d < Math.max(14, p.z * SC + 8) && d < bd){ bd = d; best = i; } });
  return best;
}
hero.addEventListener("pointermove", e => {
  const x = e.clientX, y = e.clientY; px = x; py = y;
  if(dragging){
    spinT = Math.max(-8, Math.min(8, spinT + (x - lastX) * .12));
    if(e.pointerType === "mouse") tiltT = Math.max(.12, Math.min(.95, tiltT + (y - lastY) * .003));
    lastX = x; lastY = y; return;
  }
  hover = pick(x, y); hero.style.cursor = hover >= 0 ? "pointer" : "";
});
hero.addEventListener("pointerdown", e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; hero.classList.add("drag");
  px = e.clientX; py = e.clientY; hover = pick(px, py); hero.dataset.sx = px; hero.dataset.sy = py;
});
addEventListener("pointerup", e => {
  if(!dragging) return; dragging = false; hero.classList.remove("drag");
  const x = e.clientX, y = e.clientY;
  if(Math.hypot(x - hero.dataset.sx, y - hero.dataset.sy) < 6 && pick(x, y) < 0 && comets.length < 14){
    const ang = rnd(0, 6.28), sp = rnd(3, 5);
    comets.push({x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 1, trail: []});
    for(let i = 0; i < 20; i++){ const a = rnd(0, 6.28), v = rnd(0, 3.2); sparks.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, c: ["#fff","#cfe0ff","#9fc1ff"][i % 3]}); }
  }
});
hero.addEventListener("pointerleave", () => { hover = -1; px = -999; py = -999; });
addEventListener("resize", resize);
resize(); requestAnimationFrame(draw);

/* ---------- Intro: ship jumps to light speed ---------- */
(function(){
  const intro = $("intro"), wc = $("warp"), c = wc.getContext("2d");
  const finish = () => {
    document.body.classList.add("go"); t0 = performance.now(); document.documentElement.style.overflow = "";
    intro.classList.add("out"); setTimeout(() => intro.remove(), 1400);
  };
  $("replay").onclick = () => location.reload();
  document.documentElement.style.overflow = "hidden";
  let w, h, done = false; const start = performance.now(), T1 = 1900, T2 = 4400, T3 = 5000;
  const rs = () => { const d = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; wc.width = w * d; wc.height = h * d; c.setTransform(d,0,0,d,0,0); };
  rs(); addEventListener("resize", rs);
  const mk = init => ({x: rnd(-1, 1), y: rnd(-1, 1), z: init ? rnd(.05, 1) : 1});
  const S = Array.from({length: 650}, () => mk(true));
  function frame(now){
    if(done) return;
    const t = now - start, p = Math.max(0, Math.min((t - T1) / (T2 - T1), 1)), v = .0025 + .1 * Math.pow(p, 2.3);
    c.globalCompositeOperation = "source-over"; c.fillStyle = "rgba(2,3,10," + (.6 - .4 * p) + ")"; c.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * .5, f = Math.max(w, h) * .26;
    c.globalCompositeOperation = "lighter";
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * (.2 + .6 * p));
    g.addColorStop(0, "rgba(200,225,255," + (.06 + .75 * p * p) + ")"); g.addColorStop(.4, "rgba(80,120,255," + (.04 + .25 * p) + ")"); g.addColorStop(1, "rgba(40,60,200,0)");
    c.fillStyle = g; c.fillRect(0, 0, w, h); c.lineCap = "round";
    S.forEach(s => {
      const pz = s.z; s.z -= v; if(s.z <= .02){ Object.assign(s, mk(false)); return; }
      const x0 = cx + s.x / pz * f, y0 = cy + s.y / pz * f, x1 = cx + s.x / s.z * f, y1 = cy + s.y / s.z * f;
      c.strokeStyle = "rgba(" + Math.round(255 - 90 * p) + "," + Math.round(255 - 40 * p) + ",255," + Math.min(1, (1 - s.z) * 1.5 + .12) + ")";
      c.lineWidth = (1 - s.z) * 2.2 + .4; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    });
    c.globalCompositeOperation = "source-over";
    wc.style.transform = "translate(" + (rnd(-1, 1) * p * 3).toFixed(1) + "px," + (rnd(-1, 1) * p * 3).toFixed(1) + "px)";
    $("itext").style.opacity = t < 500 ? 0 : t < 1500 ? 1 : Math.max(0, 1 - (t - 1500) / 600);
    if(t > T2){ c.fillStyle = "rgba(255,255,255," + Math.min((t - T2) / (T3 - T2), 1) + ")"; c.fillRect(0, 0, w, h); }
    if(t >= T3){ done = true; finish(); return; }
    requestAnimationFrame(frame);
  }
  $("skip").onclick = () => { if(!done){ done = true; finish(); } };
  requestAnimationFrame(frame);
})();
</script>
